<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJKTSS - Layanan Joki & Tugas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="terminal">
        <header>
            <div class="header-left">
                <button class="sidebar-toggle-btn" onclick="toggleSidebar()">
                    <span>[ MENU ]</span>
                </button>
                <div class="title-container">
                    <h1 class="shiny-text-big">TJKTSS</h1>
                </div>
            </div>
            <div class="sys-info">
                <span>USER:</span> <span id="current-user-display" class="user-badge" onclick="openProfileModal()">GUEST</span>
                <span>ROLE:</span> <span id="current-role-display" class="role-badge" onclick="toggleRoleModal()">CUSTOMER</span>
                <button onclick="handleLogout()" id="logout-btn" style="display:none; background:#111318; color:#ef4444; border:1px solid #ef4444; padding:2px 8px; font-size:11px; cursor:pointer;">[ KELUAR ]</button>
            </div>
        </header>

        <div class="app-layout" id="app-layout">
            <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>

            <aside class="sidebar">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #374151; padding-bottom: 8px; margin-bottom: 6px; white-space: nowrap;">
                    <span style="font-size: 11px; color: #00ffcc; font-weight: bold; letter-spacing: 1px;">[ MENU ]</span>
                    <button onclick="toggleSidebar()" style="background:transparent; border:1px solid #4b5563; color:#f3f4f6; padding:3px 8px; font-size:11px; cursor:pointer; align-self: center; height: auto;">[X]</button>
                </div>

                <div class="sidebar-section-title" id="nav-title-nav">[ NAVIGASI ]</div>
                <div class="sidebar-nav-group">
                    <button id="tab-feed" class="active" onclick="switchTab('FEED')">[1] FEED LAYANAN</button>
                    <button id="tab-custom" onclick="switchTab('CUSTOM')">[2] REQUEST KUSTOM</button>
                    <button id="tab-orders" onclick="switchTab('ORDERS')">[3] TRANSAKSI SAYA</button>
                    <button id="tab-all-orders" onclick="switchTab('ALL_ORDERS')" style="display:none;" class="btn-accent">[4] SEMUA TRANSAKSI</button>
                </div>

                <div class="sidebar-section-title" id="nav-title-actions" style="margin-top: 10px;">[ AKSI / MENU ]</div>
                <div class="sidebar-nav-group">
                    <button id="btn-action-request" onclick="openCustomRequestModal()" class="btn-accent">+ AJUKAN KUSTOM</button>
                    <button id="btn-action-post" onclick="openPostModal()" style="display:none;">+ POST JOKI</button>
                    <button id="btn-action-manage-emp" onclick="openEmployeeManageModal()" style="display:none;" class="btn-accent">+ KELOLA PEGAWAI</button>
                </div>
            </aside>

            <main class="main-content">
                <div class="stats-bar">
                    <div><span id="label-stat-active">LAYANAN AKTIF</span>: <span id="stat-active">0</span></div>
                    <div><span id="label-stat-custom">PERMINTAAN KUSTOM</span>: <span id="stat-custom">0</span></div>
                    <div><span id="label-stat-orders">TOTAL TRANSAKSI</span>: <span id="stat-orders">0</span></div>
                    <div><span id="label-stat-role-title">ROLE</span>: <span id="stat-role-text" style="color: #00ffcc;">CUSTOMER</span></div>
                </div>

                <div class="sorting-bar">
                    <div class="sorting-group">
                        <span id="label-sort-title" style="color: #00ffcc; font-weight: bold;">[ SORT ]:</span>
                        <button onclick="toggleSortingOrder()" id="sort-toggle-btn" style="padding: 4px 10px; font-size: 11px; border-color: #00ffcc; color: #00ffcc; background:#111318; cursor: pointer;">[ TERBARU ]</button>
                    </div>
                    <div class="sorting-group" id="filter-container">
                        <span id="label-filter-title" style="color: #00ffcc; font-weight: bold;">[ FILTER ]:</span>
                        <select id="filter-status-select" onchange="window.renderGrid()">
                            <option value="ALL" id="opt-filter-all">SEMUA STATUS</option>
                            <option value="DP" id="opt-filter-dp">PENDING DP (BELUM LUNAS)</option>
                            <option value="COMPLETED" id="opt-filter-completed">SELESAI</option>
                            <option value="PENDING" id="opt-filter-pending">BELUM SELESAI</option>
                        </select>
                        <select id="filter-staff-select" onchange="window.renderGrid()">
                            <option value="ALL" id="opt-filter-staff">SEMUA PEKERJA</option>
                        </select>
                        <input type="text" id="filter-customer-input" placeholder="Cari customer..." oninput="window.renderGrid()">
                    </div>
                </div>

                <div id="feed-grid" class="grid-container"></div>
            </main>
        </div>
    </div>

    <!-- Google Authentication Overlay -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box" style="text-align: center;">
            <div class="modal-title" id="txt-auth-title">[ AUTENTIKASI DIPERLUKAN ]</div>
            <p style="font-size: 12px; color: #d1d5db; margin-bottom: 20px;" id="txt-auth-desc">MASUK DENGAN GOOGLE UNTUK MENGAKSES TJKTSS</p>
            <button onclick="loginWithGoogle()" style="border-color: #00ffcc; color: #00ffcc; padding: 12px 24px; font-size: 13px; width: 100%; cursor: pointer; background: #111318;">
                [G] MASUK DENGAN GOOGLE
            </button>
        </div>
    </div>

    <!-- Custom Request Modal -->
    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <div class="modal-title" id="m-title-custom">[ BUAT PERMINTAAN KUSTOM ]</div>
            <div class="modal-field">
                <label id="m-label-cust-title">JUDUL TUGAS / JOKI</label>
                <input type="text" id="cust-title" placeholder="cth., Pembuatan Website React">
            </div>
            <div class="modal-field">
                <label id="m-label-cust-desc">DESKRIPSI TUGAS & KEBUTUHAN</label>
                <textarea id="cust-desc" rows="4" placeholder="Jelaskan detail tugas atau joki..."></textarea>
            </div>
            <div class="modal-field">
                <label id="m-label-cust-phone">NOMOR TELEPON / WHATSAPP</label>
                <input type="text" id="cust-phone" placeholder="cth., 081234567890">
            </div>
            <div class="modal-field">
                <label id="m-label-cust-link">LINK ATAU CATATAN FILE TUGAS (OPSIONAL)</label>
                <input type="text" id="cust-link" placeholder="cth., Link Google Drive">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;">
                <button onclick="closeModal('custom-modal')" style="background:#111318; color:#f3f4f6; border:1px solid #4b5563; cursor: pointer;" id="btn-cust-cancel">BATAL</button>
                <button onclick="submitCustomRequestOnly()" style="background:#111318; color:#00ffcc; border:1px solid #00ffcc; cursor: pointer;" id="btn-cust-submit">AJUKAN TUGAS</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
