<!-- Sample updated task card component structure -->
<div class="task-card status-full-payment">
  <div class="task-header">
    <h3>Routing and dhcp server</h3>
    <p>7.500 Rp Paid (Total: 15.000 Rp)</p>
    <p>Status: <span class="status-badge">FULL_PAYMENT</span></p>
  </div>

  <div class="proofs-collapsible">
    <button class="proofs-toggle-btn" onclick="toggleProofs(this)">
      <span>PAYMENT PROOFS (<span class="proof-count">1</span>)</span>
      <span class="arrow-icon">[►]</span>
    </button>
    <div class="proofs-content hidden">
      <div class="proof-item">
        <a href="qris.jpg" target="_blank" class="proof-link">View Proof 1</a>
      </div>
    </div>
  </div>

  <div class="admin-payment-actions">
    <label for="proof-upload" class="upload-btn-label">[+ UPLOAD PROOF]</label>
    <input type="file" id="proof-upload" accept="image/*" style="display: none;" onchange="handleAdminPaymentUpload(event, 'tx-4161')">
    <button class="btn-mark-full" onclick="markAsFullPayment('tx-4161')">MARK FULL PAYMENT</button>
  </div>
</div>
